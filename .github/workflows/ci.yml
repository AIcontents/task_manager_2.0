name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Тесты (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Сборка и тесты
        run: ./mvnw -B verify

      - name: Отчёты тестов (при падении)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: target/surefire-reports/

  docker:
    name: Docker (образ + docker compose + persistence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker compose up --build
        run: docker compose up -d --build

      - name: Smoke-тест API (регистрация, вход, задачи, права ADMIN)
        run: ./scripts/smoke-test.sh

      - name: docker compose down (без -v) и повторный запуск
        run: |
          docker compose down
          docker compose up -d

      - name: Данные пережили перезапуск
        run: ./scripts/smoke-test.sh --expect-persisted

      - name: Логи (при падении)
        if: failure()
        run: docker compose logs

      - name: Очистка
        if: always()
        run: docker compose down -v
