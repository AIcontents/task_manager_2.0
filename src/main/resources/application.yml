spring:
  application:
    name: task-manager
  profiles:
    # Профиль репозитория: dev - InMemoryTaskRepository, prod - PriorityTaskRepository
    active: dev

app:
  name: Task Manager
  max-tasks: 100
  default-priority: MEDIUM
  runner:
    # Консольный сценарий из Части 1. Включить: --app.runner.enabled=true
    # (для шага 3 с лимитом добавьте --app.max-tasks=3)
    enabled: false
