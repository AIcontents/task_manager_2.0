spring:
  application:
    name: task-manager
  profiles:
    active: dev
  datasource:
    url: jdbc:h2:mem:taskdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # create-drop: таблицы создаются при старте и удаляются при остановке (для учёбы).
      # В реальных проектах схему ведут миграциями (Flyway/Liquibase) - см. Часть 6.
      ddl-auto: create-drop
    show-sql: true          # обязательно для отладки: видно SQL, который генерирует Spring Data
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true         # http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:taskdb, user: sa)

app:
  name: Task Manager
  max-tasks: 100
  default-priority: MEDIUM
  runner:
    # Консольный сценарий из Части 1. Включить: --app.runner.enabled=true
    enabled: false
