<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Задача')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container">
    <div class="card">
        <h1 th:text="${task.title}">Название задачи</h1>

        <dl class="details">
            <dt>Описание</dt>
            <dd th:text="${task.description} ?: '—'">Описание</dd>
            <dt>Приоритет</dt>
            <dd><span class="badge" th:classappend="'priority-' + ${task.priority}" th:text="${task.priority}">HIGH</span></dd>
            <dt>Статус</dt>
            <dd><span class="badge" th:classappend="'status-' + ${task.status}" th:text="${task.status}">NEW</span></dd>
            <dt>Владелец</dt>
            <dd th:text="${task.ownerEmail} ?: '—'">owner@example.com</dd>
            <dt>Создана</dt>
            <dd th:text="${#temporals.format(task.createdAt, 'dd.MM.yyyy HH:mm')}">01.01.2026 12:00</dd>
        </dl>

        <a class="btn btn-secondary" th:href="@{/web/tasks}">← К списку</a>
        <a class="btn" sec:authorize="hasAnyRole('USER','ADMIN')"
           th:href="@{/web/tasks/{id}/edit(id=${task.id})}">Редактировать</a>
        <form class="inline" sec:authorize="hasRole('ADMIN')"
              th:action="@{/web/tasks/{id}/delete(id=${task.id})}" method="post"
              onsubmit="return confirm('Удалить задачу?');">
            <button class="btn btn-danger" type="submit">Удалить</button>
        </form>
    </div>
</main>
</body>
</html>
