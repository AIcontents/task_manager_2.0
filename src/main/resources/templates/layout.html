<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
  Общие фрагменты. Подключаются так:
    <head th:replace="~{layout :: head('Заголовок страницы')}"></head>
    <nav th:replace="~{layout :: navbar}"></nav>
  th:replace ЗАМЕНЯЕТ тег целиком содержимым фрагмента, th:insert вставляет фрагмент ВНУТРЬ тега.
-->
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' · Task Manager'">Task Manager</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<nav class="navbar" th:fragment="navbar">
    <a class="brand" th:href="@{/web/tasks}">Task Manager</a>
    <a th:href="@{/web/tasks}">Задачи</a>
    <a th:href="@{/web/tasks/new}" sec:authorize="hasAnyRole('USER','ADMIN')">+ Создать задачу</a>
    <span class="spacer"></span>
    <span class="user">
        Вы вошли как <strong th:text="${#authentication.name}">user@example.com</strong>
        <span class="badge" sec:authorize="hasRole('ADMIN')">ADMIN</span>
    </span>
    <!-- Выход - POST-форма: Spring Security требует CSRF-токен, Thymeleaf добавляет его сам -->
    <form class="inline" th:action="@{/logout}" method="post">
        <button class="btn btn-link" type="submit">Выйти</button>
    </form>
</nav>
</body>
</html>
