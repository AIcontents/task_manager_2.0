# Профиль docker: включается переменной SPRING_PROFILES_ACTIVE=docker (см. docker-compose.yml).
# Один и тот же код - два окружения: локально (профиль dev, H2) и в контейнере (PostgreSQL).
# Файл хранит только ИМЕНА переменных окружения - ни паролей, ни секретов в репозитории нет.

# --- PostgreSQL: адрес, логин и пароль приходят из окружения контейнера ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Схему создаёт Flyway (db/migration, без демо-данных dev), Hibernate её не трогает (ddl-auto=none из application.yml)
spring.flyway.locations=classpath:db/migration

# --- тише логи: SQL не печатаем, консоль H2 в контейнере не нужна ---
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.h2.console.enabled=false

# root=WARN убирает шум библиотек, но свои пакеты оставляем на INFO: нужна строка "Started Application in X seconds"
logging.level.root=WARN
logging.level.com.example=INFO
# логирование каждого вызова сервиса (аспект) в контейнере не нужно
logging.level.com.example.aspect=WARN

# JWT_SECRET, APP_ADMIN_EMAIL, APP_ADMIN_PASSWORD читаются напрямую из окружения
# (jwt.secret=${JWT_SECRET:...} в application.yml; app.admin.* - relaxed binding переменных APP_ADMIN_*)
