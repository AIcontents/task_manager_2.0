# Профиль тестов (@ActiveProfiles("test")): схему создают миграции Flyway, но БЕЗ демо-данных dev, БД - в памяти.
spring:
  datasource:
    url: jdbc:h2:mem:testdb
  flyway:
    locations: classpath:db/migration
logging:
  level:
    org.flywaydb: INFO
    org.springframework.transaction: INFO
    org.springframework.orm.jpa.JpaTransactionManager: INFO
